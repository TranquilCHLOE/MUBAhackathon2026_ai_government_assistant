<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MyAssist — Malaysian Public Service Assistant</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033;height:100vh;display:flex;flex-direction:column}
    .header{padding:16px 20px;background:#fff;border-bottom:1px solid #e3e7ef;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .header h1{margin:0;font-size:20px}
    .header p{margin:2px 0 0;font-size:12px;color:#5e687b}
    select{border-radius:10px;padding:8px 10px;font-size:14px;border:1px solid #ccd3df;background:#fff}
    .chatLog{flex:1;overflow-y:auto;padding:20px;max-width:820px;width:100%;margin:0 auto}
    .row{display:flex;margin-bottom:14px}
    .row.user{justify-content:flex-end}
    .row.bot{justify-content:flex-start}
    .bubble{max-width:80%;border-radius:16px;padding:12px 16px;line-height:1.55;font-size:15px}
    .bubble.user{background:#172033;color:#fff;border-bottom-right-radius:4px}
    .bubble.bot{background:#fff;border:1px solid #e3e7ef;border-bottom-left-radius:4px;box-shadow:0 3px 12px rgba(20,30,50,.04)}
    .bubble.bot.loading{color:#8790a0;font-style:italic}
    .meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}
    .badge-mode{background:#eef2ff;color:#3949ab}
    .badge-truth{color:#fff}
    .badge-agree{background:#eef7ef;color:#1b6b3a}
    .badge-disagree{background:#fdeeee;color:#a32020}
    .badge-web{background:#fff6e5;color:#8a5a00}
    .details-toggle{background:none;border:0;color:#3949ab;font-size:12px;font-weight:700;cursor:pointer;padding:0;margin-top:8px}
    .details{display:none;margin-top:10px;border-top:1px solid #edf0f5;padding-top:10px;font-size:13px}
    .details.open{display:block}
    .details h4{margin:10px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#687386}
    .trace{margin:0;padding-left:18px;line-height:1.6}
    .trace li{margin-bottom:3px}
    .vote{border-top:1px solid #f4f5f8;padding:7px 0;font-size:13px}
    .vote:first-child{border-top:0}
    .source{border-top:1px solid #f4f5f8;padding:7px 0;font-size:13px}
    .source:first-child{border-top:0}
    .reqid{margin-top:10px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:#9aa2b1;word-break:break-all}
    .inputBar{flex-shrink:0;border-top:1px solid #e3e7ef;background:#fff;padding:14px 20px}
    .inputWrap{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
    textarea{flex:1;min-height:46px;max-height:140px;border:1px solid #ccd3df;border-radius:12px;padding:12px 14px;font-size:15px;resize:none;font-family:inherit}
    button.send{border:0;background:#172033;color:#fff;cursor:pointer;font-weight:700;border-radius:10px;padding:12px 18px;font-size:14px;flex-shrink:0}
    button.send:disabled{opacity:.5;cursor:wait}
    .notice{font-size:11px;color:#9aa2b1;text-align:center;margin:8px auto 0;max-width:820px}
    .error{color:#a32020}
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>🇲🇾 MyAssist</h1>
      <p>Ask a question or paste a claim/URL — routed automatically, cross-checked by two AI models.</p>
    </div>
    <select id="language">
      <option value="en">English</option>
      <option value="ms">Bahasa Malaysia</option>
      <option value="zh">中文</option>
    </select>
  </div>

  <div class="chatLog" id="chatLog"></div>

  <div class="inputBar">
    <div class="inputWrap">
      <textarea id="messageInput" placeholder="Ask about MyKad, passport, driving licence... or paste a claim/URL to fact-check" rows="1"></textarea>
      <button class="send" id="sendBtn">Send</button>
    </div>
    <p class="notice">Truth Score reflects how well available evidence supports an answer or claim, cross-checked by two independent AI models — not a legal or official determination.</p>
  </div>

<script>
const API_URL = "http://127.0.0.1:8000";
const $ = id => document.getElementById(id);
const chatLog = $("chatLog");

function esc(v){return String(v ?? "").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}

function truthColor(score){
  if(score>=70) return "#2f9e4f";
  if(score>=40) return "#e0a419";
  return "#d9432e";
}

function addUserMessage(text){
  const row = document.createElement("div");
  row.className = "row user";
  row.innerHTML = `<div class="bubble user">${esc(text)}</div>`;
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function addLoadingBubble(){
  const row = document.createElement("div");
  row.className = "row bot";
  row.innerHTML = `<div class="bubble bot loading">Thinking...</div>`;
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
  return row;
}

function traceHtml(trace){
  if(!trace || !trace.length) return "<p style='color:#9aa2b1'>No reasoning trace returned.</p>";
  return `<ol class="trace">${trace.map(step=>`<li>${esc(step)}</li>`).join("")}</ol>`;
}

function votesHtml(votes){
  if(!votes || !votes.length) return "<p style='color:#9aa2b1'>Single-model result — no second vote available.</p>";
  return votes.map(v=>`
    <div class="vote">
      <b>${esc(v.model)}</b> — truth score ${esc(v.truth_score)}
      <p style="margin:4px 0 0">${esc(v.answer)}</p>
      <p class="reqid" style="margin:4px 0 0">Request ID: ${esc(v.gonka_request_id || "—")}${v.gonka_devshard_id ? " · Devshard: " + esc(v.gonka_devshard_id) : ""}</p>
    </div>
  `).join("");
}

function sourcesHtml(entries){
  if(!entries || !entries.length) return "<p style='color:#9aa2b1'>No evidence sources retrieved.</p>";
  return entries.map((e,i)=>{
    const text = e.text_ms || e.text || "No content";
    return `
    <div class="source">
      <b>Source ${i+1}: ${esc(e.source)}</b> · similarity ${esc(e.similarity)}
      <p style="margin:4px 0 0">${esc(text.slice(0,300))}${text.length>300?"…":""}</p>
    </div>`;
  }).join("");
}

function renderBotBubble(row, data, errorMsg){
  if(errorMsg){
    row.innerHTML = `<div class="bubble bot"><span class="error">${esc(errorMsg)}</span></div>`;
    return;
  }

  const mode = data.mode === "claim" ? "🕵️ Claim check" : "🔎 Q&A";
  const truthScore = data.truth_score ?? data.confidence ?? null;
  const hasVotes = data.model_votes && data.model_votes.length > 0;

  let badges = `<span class="badge badge-mode">${esc(mode)}</span>`;
  if(truthScore !== null){
    badges += `<span class="badge badge-truth" style="background:${truthColor(truthScore)}">Truth Score ${esc(truthScore)}</span>`;
  }
  if(hasVotes){
    badges += data.models_agree
      ? `<span class="badge badge-agree">✅ Models agree</span>`
      : `<span class="badge badge-disagree">⚠️ Models disagree</span>`;
  }
  if(data.web_used){
    badges += `<span class="badge badge-web">🌐 Web checked</span>`;
  }

  const detailsId = "d" + Math.random().toString(36).slice(2);
  // Transparency requirement: show the Gonka Request ID for EVERY inference
  // step, always visible (not hidden behind a click) — this is the
  // on-chain proof that more than one centralized call actually happened.
  let reqIdLine = "";
  if(hasVotes){
    reqIdLine = `<div class="reqid">${data.model_votes.map(v =>
      `${esc(v.model)} → ${esc(v.gonka_request_id || "—")}`
    ).join("<br>")}</div>`;
  } else if(data.gonka_request_id){
    reqIdLine = `<div class="reqid">Gonka Request ID: ${esc(data.gonka_request_id)}</div>`;
  }

  row.innerHTML = `
    <div class="bubble bot">
      <div>${esc(data.answer || "No answer returned.")}</div>
      <div class="meta-row">${badges}</div>
      ${(data.reasoning_trace && data.reasoning_trace.length) || hasVotes || (data.retrieved && data.retrieved.length) ? `
        <button class="details-toggle" onclick="document.getElementById('${detailsId}').classList.toggle('open')">Show reasoning &amp; sources ▾</button>
        <div class="details" id="${detailsId}">
          <h4>Reasoning Trace</h4>
          ${traceHtml(data.reasoning_trace)}
          <h4>Model Votes (Multi-Model Consensus)</h4>
          ${votesHtml(data.model_votes)}
          <h4>Evidence Sources</h4>
          ${sourcesHtml(data.retrieved)}
        </div>
      ` : ""}
      ${reqIdLine}
    </div>
  `;
}

async function sendMessage(){
  const input = $("messageInput");
  const message = input.value.trim();
  if(!message) return;

  addUserMessage(message);
  input.value = "";
  input.style.height = "auto";

  const btn = $("sendBtn");
  btn.disabled = true;
  const loadingRow = addLoadingBubble();

  try{
    const r = await fetch(`${API_URL}/chat`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message, language: $("language").value})
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.detail || "Request failed");
    renderBotBubble(loadingRow, data, null);
  }catch(e){
    renderBotBubble(loadingRow, null, e.message);
  }finally{
    btn.disabled = false;
    chatLog.scrollTop = chatLog.scrollHeight;
  }
}

$("sendBtn").onclick = sendMessage;
$("messageInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
$("messageInput").addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 140) + "px";
});
</script>
</body>
</html>
